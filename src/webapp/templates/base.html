<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ brand.name if brand else 'MODULUS' }} - Personalized Nutrition{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    
    <!-- Google Fonts - Distinctive typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Dynamic brand colors via CSS variables -->
    <style>
        :root {
            /* Default MODULUS brand */
            --color-primary: {{ brand.primary_color if brand else '#0F172A' }};
            --color-secondary: {{ brand.secondary_color if brand else '#3B82F6' }};
            --color-accent: {{ brand.accent_color if brand else '#10B981' }};
            
            /* Derived colors */
            --color-background: #FAFBFC;
            --color-surface: #FFFFFF;
            --color-text: #1E293B;
            --color-text-muted: #64748B;
            --color-border: #E2E8F0;
            --color-success: #10B981;
            --color-warning: #F59E0B;
            --color-error: #EF4444;
            
            /* Typography */
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'Space Mono', monospace;
            
            /* Spacing scale */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
            --space-16: 4rem;
            
            /* Radii */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --radius-full: 9999px;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            
            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: #0F172A;
                --color-surface: #1E293B;
                --color-text: #F1F5F9;
                --color-text-muted: #94A3B8;
                --color-border: #334155;
            }
        }
    </style>
    
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="/static/css/styles.css">
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Gradient background overlay -->
    <div class="bg-gradient"></div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                {% if brand and brand.logo_url %}
                <img src="{{ brand.logo_url }}" alt="{{ brand.name }}" class="brand-logo">
                {% else %}
                <div class="brand-mark">
                    <span class="brand-icon">⚡</span>
                    <span class="brand-name">{{ brand.name if brand else 'MODULUS' }}</span>
                </div>
                {% endif %}
                
                {% if product %}
                <div class="product-badge">
                    <span class="product-name">{{ product.name }}</span>
                </div>
                {% endif %}
            </div>
        </header>
        
        <!-- Main content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
        
        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <div class="powered-by">
                    <span class="powered-text">Powered by</span>
                    <span class="modulus-badge">
                        <span class="modulus-icon">◈</span>
                        <span class="modulus-name">MODULUS</span>
                    </span>
                </div>
                <div class="footer-links">
                    <a href="#" class="footer-link">Privacy</a>
                    <a href="#" class="footer-link">Terms</a>
                </div>
            </div>
        </footer>
    </div>
    
    <!-- JavaScript -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
