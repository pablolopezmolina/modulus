# MODULUS - Project Configuration
# Version: 3.0

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modulus"
version = "3.0.0"
description = "Decision & Compliance OS for the supplements industry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | __pycache__
    | build
    | dist
)/
'''

[tool.flake8]
max-line-length = 100
ignore = ["E501", "W503"]
exclude = [".git", "__pycache__", "build", "dist"]
